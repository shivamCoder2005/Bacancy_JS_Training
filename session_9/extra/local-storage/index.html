<!DOCTYPE html>
<html lang="en">

<head>
    <title>Dark Mode</title>
    <style>
        .body-white {
            background-color: white;
            color: black;
            transition: background 0.3s, color 0.3s;
        }

        .body-dark {
            background-color: #121212;
            color: #eaeaea;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button id="toggleTheme">Toggle Theme</button>

    <h1>Hello Shivam </h1>

    <script src="script.js"></script>
</body>

</html>
